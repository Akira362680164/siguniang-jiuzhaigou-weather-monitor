name: Update Western Sichuan Weather Monitor

on:
  workflow_dispatch:
  schedule:
    # Beijing time: 02:17, 08:17, 14:17, 20:17, after the main model cycles.
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: western-sichuan-weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Open-Meteo data and write artifacts
        id: pipeline
        continue-on-error: true
        run: python src/pipeline.py

      - name: Check generated artifacts
        id: artifacts
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest = Path("data/latest")
          required = ["status.json", "summary.json", "target_summary.json", "hres.json", "gfs.json", "ensemble.json", "gefs.json", "historical_comparison.json"]
          missing = [name for name in required if not (latest / name).is_file()]
          if missing:
              raise SystemExit("GENERATED_ARTIFACTS_MISSING:" + ",".join(missing))
          status = json.loads((latest / "status.json").read_text(encoding="utf-8"))
          summary = json.loads((latest / "summary.json").read_text(encoding="utf-8"))
          print("LATEST_GENERATED_AT=" + str(status.get("generated_at")))
          print("LATEST_DATA_DATE=" + str(status.get("data_date")))
          print("LATEST_PIPELINE_STATUS=" + str(status.get("pipeline_status")))
          print("TARGET_COVERAGE=" + json.dumps(status.get("target_coverage", {}), ensure_ascii=False, sort_keys=True))
          if status.get("generated_at") != summary.get("generated_at"):
              raise SystemExit("GENERATED_AT_MISMATCH=status.json vs summary.json")
          PY
          git status --short

      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/archive
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: update western Sichuan weather data"
            git push origin HEAD:main
          fi

      - name: Surface unexpected pipeline failure
        if: steps.pipeline.outcome == 'failure' || steps.artifacts.outcome == 'failure'
        run: exit 1
